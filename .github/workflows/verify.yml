name: Verify canonical analytics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: perppulse
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked --test service postgres_round_trip -- --ignored
        env:
          PERPPULSE_TEST_DATABASE_URL: host=127.0.0.1 user=postgres dbname=perppulse
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: python3 scripts/check_repository_policy.py --tracked
      - run: git diff --check
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: dot -Tsvg perppulse_opm.dot -o /tmp/perppulse_opm.svg
  envio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: envio
      - run: pnpm codegen
        working-directory: envio
      - run: pnpm install --frozen-lockfile
        working-directory: envio
      - run: pnpm typecheck && pnpm test
        working-directory: envio
  sdk-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: python3 scripts/test_sdk_reference.py
      - run: cargo fmt --manifest-path tools/perpl-reference/Cargo.toml --check
      - run: cargo build --manifest-path tools/perpl-reference/Cargo.toml --locked
      - run: cargo test --manifest-path tools/perpl-reference/Cargo.toml --locked
      - run: cargo clippy --manifest-path tools/perpl-reference/Cargo.toml --locked --all-targets -- -D warnings
