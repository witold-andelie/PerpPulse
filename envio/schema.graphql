enum LifecycleKind {
  ACCOUNT_CREATED
  ACCOUNT_LIQUIDATION_CREDIT
  ACCOUNT_TO_PROTOCOL_TRANSFER
  COLLATERAL_DEPOSIT
  COLLATERAL_WITHDRAWAL
  POSITION_OPENED
  POSITION_INCREASED
  POSITION_DECREASED
  POSITION_CLOSED
  POSITION_LIQUIDATED
  POSITION_LIQUIDATION_CREDIT
  POSITION_DELEVERAGED
  POSITION_INVERTED
  POSITION_UNWOUND
  COLLATERAL_INCREASED
  COLLATERAL_DECREASED
  MARKET_FUNDING
  MARK_UPDATED
  FUNDING_SCALE_UPDATED
  MAKER_FILL
  CONTRACT_ADDED
  PROTOCOL_TO_ACCOUNT_TRANSFER
}

"""
Canonical on-chain fact. Identity is (chainId, blockHash, txHash, logIndex).
This table is the Envio-backed source for the Rust ledger; it is not a second
position book.
"""
type CanonicalEvent @index(fields: ["chainId", "blockNumber", "logIndex"]) @index(fields: ["chainId", "accountId", "blockNumber", "logIndex"]) @index(fields: ["chainId", "perpetualId", "abiEventName", "blockNumber", "logIndex"]) {
  id: ID!
  chainId: Int!
  blockNumber: BigInt!
  blockHash: String!
  parentHash: String!
  txHash: String!
  logIndex: Int!
  timestampMs: BigInt!
  srcAddress: String!
  abiEventName: String!
  kind: LifecycleKind!
  accountId: BigInt
  perpetualId: Int
  positionType: Int
  owner: String
  leverageHdths: BigInt
  lotLns: BigInt
  startLotLns: BigInt
  endLotLns: BigInt
  liqLotLns: BigInt
  pricePns: BigInt
  markPricePns: BigInt
  liqPricePns: BigInt
  amountCns: BigInt
  balanceCns: BigInt
  startBalanceCns: BigInt
  depositCns: BigInt
  startDepositCns: BigInt
  endDepositCns: BigInt
  deltaPnlCns: BigInt
  fundingCns: BigInt
  insFeeCns: BigInt
  protFeeCns: BigInt
  feeCns: BigInt
  fundingRatePct100k: BigInt
  fundingPricePns: BigInt
  fundingPaymentPns: BigInt
  fundingSumPns: BigInt
  fundingEventBlock: BigInt
  fundingAllowOverwrite: Boolean
  fundingScalingExp: BigInt
  positionFmvCns: BigInt
  paymentCns: BigInt
  amountOwedCns: BigInt
  payloadJson: String!
  schemaVersion: String!
  handlerVersion: String!
  classifierVersion: String!
  ingestionProfile: String!
  abiFingerprint: String!
}
